<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How's Your Glow?</title>
  <style>
    body { margin:0; background:#101820; color:#F5F7FA; font-family:'Lora',serif; }
    .wrapper { max-width:640px; margin:0 auto; padding:36px 24px; }
    h1 { font-family:'Bangers',cursive; color:#FFD700; font-size:40px; }
    .card { background:#0F172A; border-radius:24px; padding:36px; border:1px solid rgba(0,209,178,0.4); }
    .cta { display:inline-block; margin-top:24px; padding:14px 30px; border-radius:999px; background:#FFD700; color:#1A1A1A; text-decoration:none; font-family:'Bangers',cursive; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <h1>Did your sweater steal the show?</h1>
      <p>We want to see the afterglow! Drop a Loox review (photos encouraged) and we’ll send you a $10 Golden Bell credit.</p>
      <a class="cta" href="{{ event.extra.review_url }}">Leave a Review</a>
      <p style="font-size:13px;color:#9CA3AF;margin-top:20px;">Glow tip: recharge the LED pack overnight for the next party.</p>
    </div>
  </div>
</body>
</html>
