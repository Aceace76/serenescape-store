<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" role="img" aria-labelledby="title desc">
  <title>UglyGlow Primary Logo</title>
  <desc>Retro neon outlined sweater with glowing lights spelling UglyGlow.</desc>
  <defs>
    <linearGradient id="mintGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D1B2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D1B2" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="50" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style><![CDATA[
      .sweater-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .lights circle { filter: url(#softGlow); }
      .brand-name { font-family: 'Bangers', cursive; letter-spacing: 4px; }
      .tagline { font-family: 'Lora', serif; font-style: italic; }
    ]]></style>
  </defs>
  <rect width="2000" height="2000" fill="none" />
  <ellipse cx="1000" cy="960" rx="520" ry="520" fill="url(#mintGlow)" opacity="0.65" />
  <g filter="url(#softGlow)">
    <path class="sweater-line" stroke="#00D1B2" stroke-width="36"
      d="M610 920 Q580 690 700 560 L820 460 L920 580 L1080 580 L1280 460 L1380 560 Q1500 690 1470 920 L1460 1180 L1340 1360 L660 1360 L540 1180 Z" />
    <path class="sweater-line" stroke="#FF2E57" stroke-width="36" d="M660 1260 L660 1400" />
    <path class="sweater-line" stroke="#FF2E57" stroke-width="36" d="M1340 1260 L1340 1400" />
    <path class="sweater-line" stroke="#FFD700" stroke-width="36" d="M760 1420 L1240 1420" />
  </g>
  <g class="lights">
    <circle cx="520" cy="880" r="34" fill="#FF2E57" />
    <circle cx="620" cy="760" r="34" fill="#FFD700" />
    <circle cx="760" cy="680" r="34" fill="#00D1B2" />
    <circle cx="930" cy="640" r="34" fill="#FF2E57" />
    <circle cx="1070" cy="640" r="34" fill="#FFD700" />
    <circle cx="1240" cy="680" r="34" fill="#00D1B2" />
    <circle cx="1380" cy="760" r="34" fill="#FF2E57" />
    <circle cx="1480" cy="880" r="34" fill="#FFD700" />
    <circle cx="1500" cy="1030" r="34" fill="#00D1B2" />
    <circle cx="1460" cy="1180" r="34" fill="#FF2E57" />
    <circle cx="1340" cy="1270" r="34" fill="#FFD700" />
    <circle cx="660" cy="1270" r="34" fill="#00D1B2" />
    <circle cx="540" cy="1180" r="34" fill="#FFD700" />
    <circle cx="500" cy="1030" r="34" fill="#00D1B2" />
  </g>
  <text x="1000" y="1210" fill="#FFD700" font-size="260" text-anchor="middle" class="brand-name" stroke="#1A1A1A" stroke-width="16" paint-order="stroke fill">UglyGlow</text>
  <text x="1000" y="1320" fill="#00D1B2" font-size="96" text-anchor="middle" class="tagline">Cheeky Nostalgia. Premium Glow.</text>
</svg>
